name: Build, test and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: windows-x64, os: windows-2025 }
          - { name: macos-arm64, os: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI module
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build
        run: dotnet build Zeus.PowerStation.slnx -c Release --nologo

      - name: Test (Shelly simulators, no hardware)
        run: dotnet run --project tests/PowerStation.Tests -c Release --no-build

      - name: Package
        shell: pwsh
        run: ./src/PowerStation/build-package.ps1

      - name: Validate with the Zeus catalog tools
        shell: pwsh
        run: |
          $manifest = Get-Content src/PowerStation/plugin.json -Raw | ConvertFrom-Json
          git clone --depth 1 https://github.com/Zeus-SDR/zeus-community-features "$env:RUNNER_TEMP/zeus"
          $zip = Resolve-Path "artifacts/$($manifest.id)/$($manifest.id)-$($manifest.version).zip"
          Push-Location "$env:RUNNER_TEMP/zeus"
          ./tools/validate-package.ps1 `
            -PackagePath $zip `
            -ExpectedId $manifest.id `
            -ExpectedVersion $manifest.version `
            -ExpectedSdkAbi $manifest.sdk.abi `
            -ExpectedSdkMinVersion $manifest.sdk.minVersion `
            -ManifestSchemaPath schema/plugin.schema.json
          Pop-Location

      - name: Upload package
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: powerstation-package
          path: artifacts/**/*.zip*
